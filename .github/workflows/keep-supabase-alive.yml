name: Mantener despierto el proyecto de Supabase

# Supabase pausa el proyecto tras 7 días sin actividad (plan gratuito) — y pasados
# 90 días en pausa ya no se puede reactivar. Este workflow hace una consulta ligera
# cada 3 días para que nunca se acumulen los 7. El proyecto es compartido con
# plan-ejercicio, así que un solo ping mantiene despiertas ambas apps.
on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf -o /dev/null -w "HTTP %{http_code}\n" \
            'https://ibouktzmckphsvqabgig.supabase.co/rest/v1/estado?id=eq.1&select=id' \
            -H 'apikey: sb_publishable_8pdb7ItwgBzII8SMsdWjzA_kunVAiq5' \
            -H 'Authorization: Bearer sb_publishable_8pdb7ItwgBzII8SMsdWjzA_kunVAiq5'
